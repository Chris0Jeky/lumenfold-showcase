<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crowd cat, three detail levels</title><style>
html,body{margin:0;height:100%;background:#262c46;color:#ebe8e0;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px}
button{font:inherit;color:#ebe8e0;background:#1b2036;border:1px solid #39405e;border-radius:4px;padding:7px 11px;cursor:pointer}
button[aria-pressed=true]{background:#f2b84b;color:#0e1120;border-color:#f2b84b}
.n{position:fixed;top:10px;left:12px;opacity:.75;font-family:ui-monospace,monospace}
</style></head><body><canvas id="c" aria-label="the crowd cat, drag to turn it"></canvas><p class="n" id="n"></p>
<div class="bar"><button data-l="low">LOW</button><button data-l="mid" aria-pressed="true">MID</button><button data-l="high">HIGH</button><button id="w">wire</button></div>
<script>
const cv=document.getElementById("c"),g=cv.getContext("2d"),out=document.getElementById("n"),cache={};let m=null,yaw=0.6,pitch=0.25,wire=false,auto=true,drag=null;
function size(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;}addEventListener("resize",size);size();
async function pick(l){document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==l));
 m=cache[l]||(cache[l]=await (await fetch("lod-"+l+".json")).json());out.textContent=m.t.length.toLocaleString("en")+" triangles";}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>pick(b.dataset.l));
document.getElementById("w").onclick=e=>{wire=!wire;e.target.setAttribute("aria-pressed",wire);};
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];auto=false;cv.setPointerCapture(e.pointerId);};
cv.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*0.01;pitch=Math.max(-0.6,Math.min(1.0,pitch+(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];};
cv.onpointerup=cv.onpointercancel=()=>drag=null;
function frame(){requestAnimationFrame(frame);if(!m)return;if(auto)yaw+=0.006;
 const W=cv.width,H=cv.height,s=Math.min(W,H)*0.75,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 g.fillStyle="#262c46";g.fillRect(0,0,W,H);
 const P=m.v.map(([x,y,z])=>{y-=0.5;const X=x*cy+z*sy,Z=-x*sy+z*cy;return[X,y*cp-Z*sp,y*sp+Z*cp];});
 const f=[];for(let i=0;i<m.t.length;i++){const[a,b,c]=m.t[i],A=P[a],B=P[b],C=P[c];
  const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
  const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,n=Math.hypot(nx,ny,nz)||1;if(nz/n<=0)continue;
  f.push([(A[2]+B[2]+C[2])/3,i,0.6+0.6*Math.max(0,(nx*0.4+ny*0.7+nz*0.6)/n)]);}
 f.sort((p,q)=>p[0]-q[0]);g.lineWidth=Math.max(1,W/1400);
 for(const[,i,l]of f){const[a,b,c]=m.t[i],k=m.c[i];g.beginPath();
  for(const q of[P[a],P[b],P[c]])g.lineTo(W/2+q[0]*s,H*0.47-q[1]*s);g.closePath();
  g.fillStyle=`rgb(${Math.min(255,k[0]*l)|0},${Math.min(255,k[1]*l)|0},${Math.min(255,k[2]*l)|0})`;g.fill();if(wire){g.strokeStyle="rgba(242,184,75,.55)";g.stroke();}}}
pick("mid");frame();
</script></body></html>
